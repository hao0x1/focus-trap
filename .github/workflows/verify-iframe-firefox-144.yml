name: Verify iframe test in upstream CI browsers

on:
  push:
    branches:
      - codex/verify-iframe-firefox-144

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.implementation }} / ${{ matrix.browser }}
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox]
        implementation: [patched, upstream, diagnostic]
    container:
      image: cypress/browsers:node-22.21.0-chrome-141.0.7390.107-1-ff-144.0-edge-141.0.3537.92-1
      options: --user 1001 --shm-size=2g
    env:
      CYPRESS_BROWSER: ${{ matrix.browser }}
      VERIFY_IMPLEMENTATION: ${{ matrix.implementation }}
      VERIFY_SPEC: ${{ matrix.implementation == 'patched' && 'cypress/e2e/document.cy.js,cypress/e2e/focus-trap-demo.cy.js' || matrix.implementation == 'upstream' && 'cypress/e2e/document.cy.js' || 'cypress/e2e/iframe-lifecycle-diagnostic.cy.js' }}
    steps:
      - name: Checkout isolated verification branch
        uses: actions/checkout@v3
        with:
          fetch-depth: 3
          persist-credentials: false

      - name: Revert only production code for regression sensitivity
        if: matrix.implementation == 'upstream'
        run: git show 4db600b20240da1455fc0d899610b60b1c4cd576:index.js > index.js

      - name: Record source and exact browser versions
        run: |
          mkdir -p results
          git rev-parse HEAD | tee results/verification-commit.txt
          git diff -- index.js | tee results/production-diff.txt
          node --version | tee results/node-version.txt
          google-chrome --version | tee results/chrome-version.txt
          firefox --version | tee results/firefox-version.txt

      - name: Run Cypress with no retries
        id: cypress
        continue-on-error: ${{ matrix.implementation == 'upstream' }}
        uses: cypress-io/github-action@v5
        with:
          start: npm run start:cypress
          browser: ${{ matrix.browser }}
          command: npx cypress run --browser ${{ matrix.browser }} --headless --spec ${{ env.VERIFY_SPEC }} --config retries=0 --reporter junit --reporter-options mochaFile=results/junit-[hash].xml,toConsole=true

      - name: Check exact expected outcome
        if: always()
        env:
          CYPRESS_OUTCOME: ${{ steps.cypress.outcome }}
        run: |
          python3 - <<'PY'
          import glob, json, os, re
          import xml.etree.ElementTree as ET
          from pathlib import Path
          paths = glob.glob('results/junit-*.xml')
          cases = [case for path in paths for case in ET.parse(path).findall('.//testcase')]
          failures = [failure for case in cases for failure in case.findall('failure')]
          skipped = [skip for case in cases for skip in case.findall('skipped')]
          mode = os.environ['VERIFY_IMPLEMENTATION']
          assert paths, 'No JUnit results were produced'
          assert not skipped, 'No skipped tests are allowed'
          if mode == 'upstream':
              assert os.environ['CYPRESS_OUTCOME'] == 'failure'
              assert len(cases) == 1 and len(failures) == 1, (len(cases), len(failures))
              failure = failures[0].get('message', '') + '\n' + (failures[0].text or '')
              assert re.search(r'selectionStart.*value 5.*value was 0', failure, re.S), failure
              assert 'detached' not in failure.lower(), failure
              result = 'Expected regression reproduced: selectionStart is 0 instead of 5.'
          else:
              assert os.environ['CYPRESS_OUTCOME'] == 'success'
              expected = 46 if mode == 'patched' else 1
              assert len(cases) == expected and not failures, (len(cases), len(failures))
              result = f'{len(cases)} tests passed with no failures or skips.'
              if mode == 'diagnostic':
                  result += '\n' + Path('results/iframe-lifecycle.json').read_text()
          print(result)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(result + '\n')
          Path('results/verification-result.txt').write_text(result + '\n')
          PY

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iframe-${{ matrix.implementation }}-${{ matrix.browser }}
          path: |
            results
            cypress/screenshots
          if-no-files-found: error
