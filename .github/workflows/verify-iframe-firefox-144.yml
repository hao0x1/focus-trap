name: Verify iframe test in upstream CI browsers

on:
  push:
    branches:
      - codex/verify-iframe-firefox-144

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.implementation }} / ${{ matrix.browser }}
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox]
        implementation: [patched, upstream, submitted, diagnostic]
    container:
      image: cypress/browsers:node-22.21.0-chrome-141.0.7390.107-1-ff-144.0-edge-141.0.3537.92-1
      options: --user 1001 --shm-size=2g
    env:
      CYPRESS_BROWSER: ${{ matrix.browser }}
      VERIFY_IMPLEMENTATION: ${{ matrix.implementation }}
      VERIFY_SPEC: ${{ matrix.implementation == 'patched' && 'cypress/e2e/document.cy.js,cypress/e2e/focus-trap-demo.cy.js' || matrix.implementation == 'diagnostic' && 'cypress/e2e/iframe-lifecycle-diagnostic.cy.js' || 'cypress/e2e/document.cy.js' }}
    steps:
      - name: Checkout isolated verification branch
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Revert only production code for regression sensitivity
        if: matrix.implementation == 'upstream'
        run: git show 4db600b20240da1455fc0d899610b60b1c4cd576:index.js > index.js

      - name: Restore submitted production code for removal regression sensitivity
        if: matrix.implementation == 'submitted'
        run: git show c84c7a6ef0cf6ad45bcaa15cbe25495f44cc0075:index.js > index.js

      - name: Record source and exact browser versions
        run: |
          mkdir -p results
          git rev-parse HEAD | tee results/verification-commit.txt
          git diff -- index.js | tee results/production-diff.txt
          node --version | tee results/node-version.txt
          google-chrome --version | tee results/chrome-version.txt
          firefox --version | tee results/firefox-version.txt

      - name: Run Cypress with no retries
        id: cypress
        continue-on-error: ${{ matrix.implementation == 'upstream' || matrix.implementation == 'submitted' }}
        uses: cypress-io/github-action@v5
        with:
          start: npm run start:cypress
          browser: ${{ matrix.browser }}
          command: npx cypress run --browser ${{ matrix.browser }} --headless --spec ${{ env.VERIFY_SPEC }} --config retries=0 --reporter junit --reporter-options mochaFile=results/junit-[hash].xml,toConsole=true

      - name: Check exact expected outcome
        if: always()
        env:
          CYPRESS_OUTCOME: ${{ steps.cypress.outcome }}
        run: |
          node <<'JS'
          const assert = require('node:assert/strict');
          const crypto = require('node:crypto');
          const fs = require('node:fs');
          const { JSDOM } = require('jsdom');
          const paths = fs.readdirSync('results').filter(path => /^junit-.*\.xml$/.test(path));
          const documents = paths.map(path => new JSDOM(fs.readFileSync(`results/${path}`, 'utf8'), { contentType: 'text/xml' }).window.document);
          const cases = documents.flatMap(doc => Array.from(doc.querySelectorAll('testcase')));
          const failures = cases.flatMap(test => Array.from(test.querySelectorAll('failure')));
          const skipped = cases.flatMap(test => Array.from(test.querySelectorAll('skipped')));
          const mode = process.env.VERIFY_IMPLEMENTATION;
          assert(paths.length > 0, 'No JUnit results were produced');
          assert.equal(skipped.length, 0, 'No skipped tests are allowed');
          let result;
          if (mode === 'upstream' || mode === 'submitted') {
            assert.equal(process.env.CYPRESS_OUTCOME, 'failure');
            assert.equal(cases.length, 2);
            assert.equal(failures.length, 1);
            const failure = failures[0].getAttribute('message') + '\n' + failures[0].textContent;
            assert.doesNotMatch(failure, /detached/i);
            const failingCase = failures[0].parentElement.getAttribute('name');
            if (mode === 'upstream') {
              assert.match(failingCase, /preserves a draft/);
              assert.match(failure, /selectionStart.*value 5.*value was 0/s);
              result = 'Expected upstream regression reproduced: selectionStart is 0 instead of 5. Removal regression passed.';
            } else {
              assert.match(failingCase, /restores focus/);
              assert.match(failure, /expected.*button.*focused/s);
              result = 'Expected submitted-code regression reproduced: the remaining button was not focused. Draft-preservation regression passed.';
            }
            result += '\n' + failure;
          } else {
            assert.equal(process.env.CYPRESS_OUTCOME, 'success');
            assert.equal(cases.length, mode === 'patched' ? 47 : 1);
            assert.equal(failures.length, 0);
            result = `${cases.length} tests passed with no failures or skips.`;
            if (mode === 'diagnostic') {
              result += '\n' + fs.readFileSync('results/iframe-lifecycle.json', 'utf8');
            }
          }
          result += '\n' + fs.readFileSync(`results/${process.env.CYPRESS_BROWSER}-version.txt`, 'utf8').trim();
          result += '\nProduction index.js SHA-256: ' + crypto.createHash('sha256').update(fs.readFileSync('index.js')).digest('hex');
          console.log(result);
          console.log('::notice title=Verified result::' + result.replace(/%/g, '%25').replace(/\r/g, '%0D').replace(/\n/g, '%0A'));
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, result + '\n');
          fs.writeFileSync('results/verification-result.txt', result + '\n');
          JS

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iframe-${{ matrix.implementation }}-${{ matrix.browser }}
          path: |
            results
            cypress/screenshots
          if-no-files-found: error
